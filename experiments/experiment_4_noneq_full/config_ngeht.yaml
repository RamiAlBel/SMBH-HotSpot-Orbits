experiment:
  name: "experiment_4_noneq_full_neq45_ngeht"
  description: "Non-equatorial orbits (neq45 dataset, theta in [-45,45]) with full DPA(t) time series - NGEHT (sigma_r=0.65M, sigma_DPA=9.0deg, sigma_P=1.0min)"

data:
  dataset_path: "data/processed/dpa_dataset_neq_45.csv"
  experiment_type: "timeseries"
  num_samples: 10
  half_orbit: false

targets:
  - name: "spin"
    column: "a"
    convert_to_radians: false
  - name: "incl"
    column: "i"
    convert_to_radians: true
  - name: "theta"
    column: "theta"
    convert_to_radians: true

noise:
  enabled: true
  sigma_r: 0.65
  sigma_T: 1.0
  sigma_DPA: 9.0
  dpa_length_scale: 0.3

model:
  hidden_dims: [256, 256]
  num_blocks: 2
  dropout: 0.1

training:
  batch_size: 1024
  epochs: 200
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stop_patience: 15
  seeds: [42, 43, 44]
  use_wandb: true
  wandb_project: "exp X"

split:
  train: 0.8
  val: 0.1
  test: 0.1
  random_seed: 42
